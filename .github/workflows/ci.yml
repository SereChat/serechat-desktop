# Lint, test and build on every OS we ship. Pushing a `v*` tag also
# publishes release binaries to a GitHub release of that name.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: serechat-linux-x86_64.tar.gz
          - os: windows-latest
            archive: serechat-windows-x86_64.zip
          - os: macos-latest
            archive: serechat-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The app compares its own version with the latest release's tag to
      # update itself; a mismatch would make it reinstall the same build forever.
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p serechat-desktop
      # Windows: the exe carries its icon (build.rs). macOS: a SereChat.app
      # bundle, whose icon the Dock shows. Linux: the binary with a launcher
      # entry, icon and install.sh, so desktops show its name and icon.
      - name: Package
        shell: bash
        run: |
          icons=crates/desktop/assets/icon
          case "$RUNNER_OS" in
            Windows)
              7z a "${{ matrix.archive }}" ./target/release/serechat.exe
              ;;
            macOS)
              app=SereChat.app
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" AppIcon.iconset
              cp target/release/serechat "$app/Contents/MacOS/serechat"
              sed "s/@VERSION@/${GITHUB_REF_NAME#v}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              for size in 16 32 128 256 512; do
                sips -z "$size" "$size" "$icons/macos.png" --out "AppIcon.iconset/icon_${size}x${size}.png" > /dev/null
                sips -z "$((size * 2))" "$((size * 2))" "$icons/macos.png" --out "AppIcon.iconset/icon_${size}x${size}@2x.png" > /dev/null
              done
              iconutil -c icns AppIcon.iconset -o "$app/Contents/Resources/AppIcon.icns"
              # Ad-hoc sign the bundle as a whole; Apple silicon refuses unsigned code.
              codesign --force --deep --sign - "$app"
              tar czf "${{ matrix.archive }}" "$app"
              ;;
            Linux)
              dir=serechat-linux-x86_64
              mkdir "$dir"
              cp target/release/serechat packaging/linux/serechat.desktop packaging/linux/install.sh "$dir/"
              cp "$icons/256.png" "$dir/serechat.png"
              chmod +x "$dir/serechat" "$dir/install.sh"
              tar czf "${{ matrix.archive }}" "$dir"
              ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
